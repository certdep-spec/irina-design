<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Сторінку не знайдено | Дизайн інтер'єру Ірина</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: Georgia, "Times New Roman", serif;
        background: #fafaf9;
        color: #292524;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap { text-align: center; padding: 2rem; }
      .code { font-size: 6rem; font-weight: 700; color: #1c1917; line-height: 1; }
      h1 { font-size: 1.5rem; font-weight: 600; margin: 1rem 0 0.5rem; }
      p { color: #57534e; margin-bottom: 2rem; }
      a {
        display: inline-block;
        background: #1c1917;
        color: #ffffff;
        text-decoration: none;
        padding: 0.75rem 1.75rem;
        border-radius: 9999px;
        font-family: inherit;
      }
      a:hover { background: #44403c; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="code">404</p>
      <h1>Сторінку не знайдено</h1>
      <p>Можливо, сторінку перемістили або вона більше не існує.</p>
      <a href="/">Повернутися на головну</a>
    </div>
  </body>
</html>
