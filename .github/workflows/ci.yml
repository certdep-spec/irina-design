name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  quality:
    name: Quality (lint, typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Lint (strict)
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  build:
    name: Build + E2E smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build all mirrors
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E smoke against local preview
        run: npm run test:e2e
        env:
          TEST_MODE: "1"

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist-root
          path: dist
          retention-days: 1

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-root
          path: dist

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./

  verify-production:
    name: Verify production mirrors
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify production HTTP and SEO essentials
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL="https://certdep-spec.github.io/Irina-design"
          EXPECTED_ARTICLES=62

          check_mirror() {
            local name="$1"
            local base="$2"
            local prefix="$3"

            echo "Checking $name: $base"
            retry() {
              local attempt=1
              until "$@"; do
                if [ "$attempt" -ge 6 ]; then return 1; fi
                attempt=$((attempt + 1))
                sleep 10
              done
            }

            retry curl -fsS "$base/robots.txt" -o "robots-$name.txt"
            grep -F "Sitemap: $CANONICAL/sitemap.xml" "robots-$name.txt"

            retry curl -fsS "$base/sitemap.xml" -o "sitemap-$name.xml"
            ARTICLE_COUNT="$(grep -o "<loc>[^<]*/useful/[^<]*</loc>" "sitemap-$name.xml" | grep -v "/useful/category/" | wc -l | tr -d " ")"
            test "$ARTICLE_COUNT" -ge "$EXPECTED_ARTICLES"
            grep -F "$CANONICAL/portfolio/zhytlovyi-interier-120-m2" "sitemap-$name.xml"
            grep -F "$CANONICAL/useful/category/kitchen" "sitemap-$name.xml"
            grep -F "$CANONICAL/useful/skilky-rozetok-potribno-u-kvartyri" "sitemap-$name.xml"
            ! grep -q '<lastmod>' "sitemap-$name.xml"
            ! grep -q '<changefreq>' "sitemap-$name.xml"
            ! grep -q '<priority>' "sitemap-$name.xml"

            curl -fsS "$base/services" -o "services-$name.html"
            grep -F "rel=\"canonical\" href=\"$CANONICAL/services\"" "services-$name.html"
            grep -qi '<h1' "services-$name.html"

            STATUS="$(curl -sS -o "404-$name.html" -w '%{http_code}' "$base/nonexistent-seo-check-918")"
            test "$STATUS" = "404"
            grep -q '404' "404-$name.html"
          }

          check_mirror vercel "https://irina-design.vercel.app" "/"
          check_mirror netlify "https://irina-design.netlify.app" "/"

          echo "Checking GitHub Pages"
          PAGES="https://certdep-spec.github.io/Irina-design"
          curl -fsS "$PAGES/robots.txt" -o robots-pages.txt
          grep -F "Sitemap: $CANONICAL/sitemap.xml" robots-pages.txt
          curl -fsS "$PAGES/sitemap.xml" -o sitemap-pages.xml
          ARTICLE_COUNT="$(grep -o "<loc>[^<]*/useful/[^<]*</loc>" sitemap-pages.xml | grep -v "/useful/category/" | wc -l | tr -d " ")"
          test "$ARTICLE_COUNT" -ge "$EXPECTED_ARTICLES"
          grep -F "$CANONICAL/portfolio/zhytlovyi-interier-120-m2" sitemap-pages.xml
          curl -fsS "$PAGES/services" -o services-pages.html
          grep -F "rel=\"canonical\" href=\"$CANONICAL/services\"" services-pages.html
          grep -qi '<h1' services-pages.html

          echo "All three production mirrors passed HTTP/SEO checks."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lighthouse mobile baseline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome not found on runner; skipping Lighthouse baseline."
            exit 0
          fi
          export CHROME_PATH
          npx --yes lighthouse@12.8.2 https://certdep-spec.github.io/Irina-design \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,seo,accessibility,best-practices \
            --form-factor=mobile \
            --output=json \
            --output-path=lighthouse-mobile.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('lighthouse-mobile.json','utf8'));
          const score = id => Math.round((r.categories[id]?.score || 0) * 100);
          const a = r.audits;
          console.log('Lighthouse mobile baseline');
          console.log('performance=' + score('performance'));
          console.log('seo=' + score('seo'));
          console.log('accessibility=' + score('accessibility'));
          console.log('best-practices=' + score('best-practices'));
          console.log('FCP=' + a['first-contentful-paint']?.displayValue);
          console.log('LCP=' + a['largest-contentful-paint']?.displayValue);
          console.log('TBT=' + a['total-blocking-time']?.displayValue);
          console.log('CLS=' + a['cumulative-layout-shift']?.displayValue);
          console.log('SpeedIndex=' + a['speed-index']?.displayValue);
          NODE

  deploy-netlify:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-root
          path: dist

      - uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./dist
          production-deploy: true
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # GitHub Pages деплоится отдельным воркфлоу deploy-gh-pages.yml
  # (с BASE_PATH=/irina-design/ для правильных путей к ассетам)