name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  quality:
    name: Quality (lint, typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Lint (strict)
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  build:
    name: Build + E2E smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build all mirrors
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E smoke against local preview
        run: npm run test:e2e
        env:
          TEST_MODE: "1"

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist-root
          path: dist
          retention-days: 1

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-root
          path: dist

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./

  verify-production:
    name: Verify production SEO
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Wait for Vercel Git integration
        run: sleep 25

      - name: Verify production HTTP and SEO essentials
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://irina-design.vercel.app"

          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 6 ]; then return 1; fi
              attempt=$((attempt + 1))
              sleep 10
            done
          }

          retry curl -fsS "$BASE/robots.txt" -o robots.txt
          grep -F "Sitemap: $BASE/sitemap.xml" robots.txt

          retry curl -fsS "$BASE/sitemap.xml" -o sitemap.xml
          test "$(grep -o '<url>' sitemap.xml | wc -l | tr -d ' ')" = "111"
          grep -F "$BASE/portfolio/zhytlovyi-interier-120-m2" sitemap.xml
          grep -F "$BASE/useful/skilky-rozetok-potribno-u-kvartyri" sitemap.xml
          ! grep -q '<lastmod>' sitemap.xml
          ! grep -q '<changefreq>' sitemap.xml
          ! grep -q '<priority>' sitemap.xml

          curl -fsS "$BASE/services" -o services.html
          grep -F 'rel="canonical" href="https://irina-design.vercel.app/services"' services.html
          grep -qi '<h1' services.html

          STATUS="$(curl -sS -o 404.html -w '%{http_code}' "$BASE/nonexistent-seo-check-918")"
          test "$STATUS" = "404"
          grep -q '404' 404.html

          curl -fsSI "$BASE/admin" -o admin-headers.txt
          grep -qi '^x-robots-tag: noindex, nofollow' admin-headers.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lighthouse mobile baseline
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome not found on runner; skipping Lighthouse baseline."
            exit 0
          fi
          export CHROME_PATH
          npx --yes lighthouse@12.8.2 https://irina-design.vercel.app \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,seo,accessibility,best-practices \
            --form-factor=mobile \
            --output=json \
            --output-path=lighthouse-mobile.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('lighthouse-mobile.json','utf8'));
          const score = id => Math.round((r.categories[id]?.score || 0) * 100);
          const a = r.audits;
          console.log('Lighthouse mobile baseline');
          console.log('performance=' + score('performance'));
          console.log('seo=' + score('seo'));
          console.log('accessibility=' + score('accessibility'));
          console.log('best-practices=' + score('best-practices'));
          console.log('FCP=' + a['first-contentful-paint']?.displayValue);
          console.log('LCP=' + a['largest-contentful-paint']?.displayValue);
          console.log('TBT=' + a['total-blocking-time']?.displayValue);
          console.log('CLS=' + a['cumulative-layout-shift']?.displayValue);
          console.log('SpeedIndex=' + a['speed-index']?.displayValue);
          const diagnostics = {
            lcpElement: a['largest-contentful-paint-element']?.details?.items?.slice(0, 3),
            layoutShifts: a['layout-shifts']?.details?.items?.slice(0, 5),
            renderBlocking: a['render-blocking-resources']?.details?.items?.slice(0, 10),
            unusedJs: a['unused-javascript']?.details?.items?.slice(0, 10),
          };
          console.log('LH_DIAGNOSTICS=' + JSON.stringify(diagnostics));
          NODE

  deploy-netlify:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-root
          path: dist

      - uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./dist
          production-deploy: true
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # GitHub Pages деплоится отдельным воркфлоу deploy-gh-pages.yml
  # (с BASE_PATH=/irina-design/ для правильных путей к ассетам)